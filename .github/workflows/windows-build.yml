name: AWQM Windows full qualification
on:
  push:
    branches:
      - 'develop/awqm-foundation'
      - 'release/awqm-0.44.0'
      - 'feature/unified-launcher'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: awqm-full-foundation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  windows:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[awqm-full]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Prepare a private Windows runtime with verified SQLite
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'awqm-build-python'
          python tools/windows_runtime.py prepare $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime >> $env:GITHUB_PATH
          "PYTHONNOUSERSITE=1" >> $env:GITHUB_ENV
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Source demo smoke test
        run: python launcher.py --demo --smoke-test
      - name: Full synthetic capacity cycle (no SSH)
        run: python launcher.py --validate-scale capacity --output capacity-validation
      - name: Full synthetic concurrent HTTPS and WSS (loopback only)
        run: python launcher.py --validate-scale https --output https-validation
      - name: Retained history representative read benchmark (32 Radios, 365 days)
        run: python launcher.py --validate-scale retained --output retained-validation
      - name: Representative actual SQLite lifecycle validation
        run: python launcher.py --validate-scale lifecycle --output lifecycle-validation
      - name: Build Windows folder EXE
        run: python -m PyInstaller --noconfirm --clean --hidden-import win32timezone --onedir --name AWQM --add-data "awqm/static;awqm/static" launcher.py
      - name: Verify actual frozen native component versions
        run: python tools/windows_runtime.py verify dist/AWQM/AWQM.exe native-runtime.json
      - name: Frozen service and manager import smoke tests (no SCM or SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --service --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\AWQM\AWQM.exe --manager smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen offline update option smoke (no SCM)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --manager switch-program --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\AWQM\AWQM.exe --manager reverse-program --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\AWQM\AWQM.exe --manager rollback-data --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen executable smoke test
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --demo --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen offline parser smoke test
        shell: pwsh
        run: |
          "user 10%, system 10%, idle 80%" | Set-Content -Encoding utf8 cpu-fixture.txt
          & .\dist\AWQM\AWQM.exe --validate-cli cpu cpu-fixture.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen client-info Airtime inspection option (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --validate-cli --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen diagnostic option smoke test (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --collect-once --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen fixture engine smoke (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --engine-demo --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen HTTPS preview option smoke test (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --auth-preview --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen loopback SSH security regression (synthetic only)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --validate-ssh | Tee-Object -FilePath ssh-validation-result.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen Windows DPAPI round trip (synthetic only)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --dpapi-smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows folder ZIP
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $exeVersion = (& .\dist\AWQM\AWQM.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $exeVersion -ne $version) { throw 'Version mismatch' }
          $zip = "AWQM_${version}_Win11_x64.zip"
          Copy-Item README.md,VERSION.txt,native-runtime.json -Destination dist\AWQM
          Copy-Item capacity-validation\capacity-result.json -Destination dist\AWQM
          Copy-Item https-validation\https-result.json -Destination dist\AWQM
          Copy-Item retained-validation\retained-result.json -Destination dist\AWQM
          Copy-Item lifecycle-validation\lifecycle-result.json -Destination dist\AWQM
          Copy-Item ssh-validation-result.json -Destination dist\AWQM
          Copy-Item docs -Destination dist\AWQM\docs -Recurse
          python -m pip freeze | Set-Content -Encoding utf8 dist\AWQM\BUILD-DEPENDENCIES.txt
          Copy-Item dist\AWQM\BUILD-DEPENDENCIES.txt -Destination BUILD-DEPENDENCIES.txt
          Compress-Archive -Path dist\AWQM -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content -Encoding ascii SHA256SUMS.txt
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Frozen offline package verification and staging
        env:
          AWQM_ZIP: ${{ steps.package.outputs.zip }}
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --stage-package $env:AWQM_ZIP --sha256 (Get-FileHash -LiteralPath $env:AWQM_ZIP -Algorithm SHA256).Hash --output staged-verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $staged = 'staged-verification'
          $dllDigest = (Get-FileHash "$staged/_internal/sqlite3.dll" -Algorithm SHA256).Hash
          if ($dllDigest -ne '4b59d3cded9dc1608544160f3b4b10ac974c6ac0d6ffc23064e5f4c8dbd05aea') { throw 'Staged SQLite DLL differs from the verified vendor build' }
          python tools/windows_runtime.py verify "$staged/AWQM.exe" staged-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Inno Setup 6 compiler
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
            if ((Get-FileHash -LiteralPath $setup).Hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw 'Inno Setup installer digest mismatch' }
            $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS' -WindowStyle Hidden -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Inno Setup installation failed: $($proc.ExitCode)" }
          }
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 compiler missing' }
      - name: Build the single offline installer
        shell: pwsh
        run: |
          ./tools/build-installer.ps1 -Payload dist/AWQM -OutputDirectory installer-output
          $files = @(Get-ChildItem installer-output -Force)
          if ($files.Count -ne 1 -or $files[0].Name -cne 'AWQM.exe' -or $files[0].PSIsContainer) { throw 'Unexpected delivery layout' }
      - uses: actions/upload-artifact@v4
        with:
          name: AWQM-unified-installer
          path: installer-output/AWQM.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: AWQM-Windows-dev-x64
          path: |
            ${{ steps.package.outputs.zip }}
            SHA256SUMS.txt
            BUILD-DEPENDENCIES.txt
            native-runtime.json
            capacity-validation/capacity-result.json
            https-validation/https-result.json
            retained-validation/retained-result.json
            lifecycle-validation/lifecycle-result.json
            ssh-validation-result.json
          if-no-files-found: error
          retention-days: 3

  installed-app:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/download-artifact@v4
        with:
          name: AWQM-unified-installer
          path: installer
      - name: Install the current-user package and open its Start menu entry
        shell: pwsh
        run: |
          $files = @(Get-ChildItem installer -Force)
          if ($files.Count -ne 1 -or $files[0].Name -cne 'AWQM.exe') { throw 'Unexpected installer contents' }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\AWQM\AWQM.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Aruba Wireless Quality Monitor.lnk'
          if ((Test-Path -LiteralPath $app) -or (Test-Path -LiteralPath $shortcut)) { throw 'Existing installation on fresh runner' }
          $proc = Start-Process -FilePath $files[0].FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER' -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Application installation failed: $($proc.ExitCode)" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          if (!(Test-Path -LiteralPath $shortcut) -or $link.Arguments) { throw 'Normal Start menu entry missing or incorrect' }
          python -c "import os, sys; sys.exit(0 if os.path.samefile(sys.argv[1],sys.argv[2]) else 1)" "$($link.TargetPath)" "$app"
          if ($LASTEXITCODE -ne 0) { throw 'Start menu shortcut points to a different program' }
          $version = (& $app --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne (Get-Content VERSION.txt -Raw).Trim()) { throw 'Installed executable version mismatch' }
          & $app --demo --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.installed_app_validation "$shortcut" "$app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (!$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            python -m tools.installed_app_validation --repeat-download "$($files[0].FullName)" "$app"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Warning 'Elevated runner: download relaunch requires the separate non-elevated Windows 11 validation.'
          }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.device_settings_validation "$app" "device-settings-result.json" --wait-for-refresh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $registration = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -like 'Aruba Wireless Quality Monitor*' -and $_.DisplayVersion -eq $version })
          if ($registration.Count -ne 1) { throw 'Current-user uninstall registration missing' }
          python -c "import os, sys; sys.exit(0 if os.path.samefile(sys.argv[1],sys.argv[2]) else 1)" "$($registration[0].InstallLocation)" (Split-Path $app)
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall registration points to a different program' }
          $uninstaller = $registration[0].UninstallString.Trim('"')
          $proc = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or (Test-Path -LiteralPath $app) -or (Test-Path -LiteralPath $shortcut)) { throw 'Uninstall did not remove installed app and shortcut' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWQM-installed-web-evidence
          path: |
            device-settings-result.json
            device-settings-result.error.txt
          if-no-files-found: warn
          retention-days: 3

  service-lifecycle:
    needs: windows
    if: >-
      always() && (needs.windows.result == 'success' ||
      (needs.windows.result == 'skipped' && github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[awqm-scm ')))
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source provenance for a service-only retry
        id: candidate
        if: needs.windows.result == 'skipped'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $message = (Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).head_commit.message
          if ($message -cnotmatch '\[awqm-scm ([1-9][0-9]{0,17})\]') { throw 'Missing candidate build run ID' }
          $buildId = $Matches[1]
          $build = gh run view $buildId --json name,headSha,headBranch,jobs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $build.name -ne 'AWQM Windows full qualification' -or $build.headBranch -ne $env:GITHUB_REF_NAME) { throw 'Different candidate workflow or branch' }
          $passed = @($build.jobs | Where-Object { $_.name -in @('windows','installed-app','browser-ui','dependency-audit') -and $_.conclusion -eq 'success' })
          if ($passed.Count -ne 4 -or $build.headSha -cnotmatch '^[0-9a-f]{40}$') { throw 'Candidate qualifications incomplete' }
          $sourceSha = $build.headSha
          git merge-base --is-ancestor $sourceSha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate is not an ancestor' }
          $changed = @(git diff --name-only $sourceSha HEAD)
          if ($LASTEXITCODE -ne 0 -or @($changed | Where-Object { $_ -notin @('tools/hosted_scm_validation.py','.github/workflows/windows-build.yml') }).Count -gt 0) { throw 'Packaged inputs changed; request a full build' }
          $workflow = '.github/workflows/windows-build.yml'
          $previous = (git show "${sourceSha}:$workflow") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Missing original build definition' }
          $current = (Get-Content $workflow) -join "`n"
          $boundary = "`n  service-lifecycle:"
          if (-not $previous.Contains($boundary) -or $previous.Split($boundary)[0] -cne $current.Split($boundary)[0]) { throw 'Windows build definition changed' }
          "run=$buildId" >> $env:GITHUB_OUTPUT
          "source=$sourceSha" >> $env:GITHUB_OUTPUT
          Write-Host "Requalifying the Windows artifact from run $buildId, source $sourceSha."
      - uses: actions/checkout@v4
        with:
          ref: ed1451261083dbd7e73fb672e23ef36719ddc44d
          path: baseline-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/download-artifact@v4
        with:
          name: AWQM-Windows-dev-x64
          run-id: ${{ steps.candidate.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
          path: candidate-package
      - name: Build the prior 0.42.0 service from its pinned source
        working-directory: baseline-source
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --hidden-import win32timezone --onedir --name AWQM --add-data "awqm/static;awqm/static" launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/AWQM/AWQM.exe dist/AWQM/AWQM_Service.exe
          Copy-Item dist/AWQM/AWQM.exe dist/AWQM/AWQM_Manager.exe
          Copy-Item VERSION.txt,README.md -Destination dist/AWQM
          Copy-Item docs -Destination dist/AWQM/docs -Recurse
          python -m pip freeze | Set-Content -Encoding utf8 dist/AWQM/BUILD-DEPENDENCIES.txt
      - name: Install offline fixture and console test dependencies
        run: python -m pip install -r requirements.txt pywinpty==3.1.2
      - name: Qualify real SCM registration, restart, upgrade and rollback
        env:
          AWQM_BUILD_SHA: ${{ steps.candidate.outputs.source || github.sha }}
          AWQM_BUILD_RUN: ${{ steps.candidate.outputs.run || github.run_id }}
        shell: pwsh
        run: |
          $sums = (Get-Content candidate-package/SHA256SUMS.txt -Raw).Trim() -split '\s+'
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($sums.Length -ne 2 -or $sums[1] -ne "AWQM_${version}_Win11_x64.zip") { throw 'Unexpected package manifest' }
          python -m tools.hosted_scm_validation --archive (Resolve-Path (Join-Path candidate-package $sums[1])) --sha256 $sums[0] --previous (Resolve-Path baseline-source/dist/AWQM) --output service-lifecycle-result.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWQM-hosted-service-evidence
          path: service-lifecycle-result.json
          if-no-files-found: warn
          retention-days: 3

  dependency-audit:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/download-artifact@v4
        with:
          name: AWQM-Windows-dev-x64
          path: audit-input
      - name: Install separate advisory scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Audit exact build dependency versions
        shell: pwsh
        run: |
          python -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r audit-input/BUILD-DEPENDENCIES.txt --format json --output dependency-audit.json
          $scannerExit = $LASTEXITCODE
          python tools/check_dependency_audit.py audit-input/BUILD-DEPENDENCIES.txt dependency-audit.json $scannerExit dependency-audit-summary.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWQM-dependency-audit
          path: |
            audit-input/BUILD-DEPENDENCIES.txt
            dependency-audit.json
            dependency-audit-summary.json
          if-no-files-found: warn
          retention-days: 3

  browser-ui:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[awqm-full]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install isolated browser validation dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium for CI only
        run: python -m playwright install chromium
      - name: Actual synthetic diagnostic browser validation
        run: python -m tools.browser_validation --output browser-validation
      - name: Actual local device settings browser validation
        run: python -m tools.browser_device_validation --output browser-device-result.json
      - name: Ten concurrent Chromium sessions on the full synthetic inventory
        run: python -m tools.browser_load_validation --output browser-load-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWQM-browser-evidence
          path: |
            browser-validation/browser-result.json
            browser-load-validation/browser-load-result.json
            browser-device-result.json
          if-no-files-found: warn
          retention-days: 3
