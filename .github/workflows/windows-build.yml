name: AWQM Windows full qualification
on:
  push:
    branches:
      - 'develop/awqm-foundation'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: awqm-full-foundation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  windows:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[awqm-full]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Source demo smoke test
        run: python launcher.py --demo --smoke-test
      - name: Full synthetic capacity cycle (no SSH)
        run: python launcher.py --validate-scale capacity --output capacity-validation
      - name: Full synthetic concurrent HTTPS and WSS (loopback only)
        run: python launcher.py --validate-scale https --output https-validation
      - name: Retained history representative read benchmark (32 Radios, 365 days)
        run: python launcher.py --validate-scale retained --output retained-validation
      - name: Representative actual SQLite lifecycle validation
        run: python launcher.py --validate-scale lifecycle --output lifecycle-validation
      - name: Build Windows folder EXE
        run: python -m PyInstaller --noconfirm --clean --hidden-import win32timezone --onedir --name AWQM --add-data "awqm/static;awqm/static" launcher.py
      - name: Create Windows service and manager entry points
        shell: pwsh
        run: |
          Copy-Item dist\AWQM\AWQM.exe dist\AWQM\AWQM_Service.exe
          Copy-Item dist\AWQM\AWQM.exe dist\AWQM\AWQM_Manager.exe
      - name: Frozen service and manager import smoke tests (no SCM or SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM_Service.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\AWQM\AWQM_Manager.exe smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen offline update option smoke (no SCM)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM_Manager.exe switch-program --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\AWQM\AWQM_Manager.exe reverse-program --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\AWQM\AWQM_Manager.exe rollback-data --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen executable smoke test
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --demo --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen offline parser smoke test
        shell: pwsh
        run: |
          "user 10%, system 10%, idle 80%" | Set-Content -Encoding utf8 cpu-fixture.txt
          & .\dist\AWQM\AWQM.exe --validate-cli cpu cpu-fixture.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen client-info Airtime inspection option (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --validate-cli --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen diagnostic option smoke test (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --collect-once --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen fixture engine smoke (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --engine-demo --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen HTTPS preview option smoke test (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --auth-preview --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen loopback SSH security regression (synthetic only)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --validate-ssh | Tee-Object -FilePath ssh-validation-result.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen Windows DPAPI round trip (synthetic only)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --dpapi-smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package development ZIP
        shell: pwsh
        run: |
          Copy-Item README.md,VERSION.txt -Destination dist\AWQM
          Copy-Item capacity-validation\capacity-result.json -Destination dist\AWQM
          Copy-Item https-validation\https-result.json -Destination dist\AWQM
          Copy-Item retained-validation\retained-result.json -Destination dist\AWQM
          Copy-Item lifecycle-validation\lifecycle-result.json -Destination dist\AWQM
          Copy-Item ssh-validation-result.json -Destination dist\AWQM
          Copy-Item docs -Destination dist\AWQM\docs -Recurse
          python -m pip freeze | Set-Content -Encoding utf8 dist\AWQM\BUILD-DEPENDENCIES.txt
          Copy-Item dist\AWQM\BUILD-DEPENDENCIES.txt -Destination BUILD-DEPENDENCIES.txt
          Compress-Archive -Path dist\AWQM -DestinationPath AWQM_0.42.1-dev_Win11_x64.zip
          $hash = (Get-FileHash AWQM_0.42.1-dev_Win11_x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  AWQM_0.42.1-dev_Win11_x64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Frozen offline package verification and staging
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --stage-package AWQM_0.42.1-dev_Win11_x64.zip --sha256 (Get-FileHash AWQM_0.42.1-dev_Win11_x64.zip -Algorithm SHA256).Hash --output staged-verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AWQM-Windows-dev-x64
          path: |
            AWQM_0.42.1-dev_Win11_x64.zip
            SHA256SUMS.txt
            BUILD-DEPENDENCIES.txt
            capacity-validation/capacity-result.json
            https-validation/https-result.json
            retained-validation/retained-result.json
            lifecycle-validation/lifecycle-result.json
            ssh-validation-result.json
          if-no-files-found: error
          retention-days: 3

  service-lifecycle:
    needs: windows
    if: >-
      always() && (needs.windows.result == 'success' ||
      (needs.windows.result == 'skipped' && github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[awqm-scm ')))
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source provenance for a service-only retry
        id: candidate
        if: needs.windows.result == 'skipped'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $message = (Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).head_commit.message
          if ($message -cnotmatch '\[awqm-scm ([1-9][0-9]{0,17})\]') { throw 'Missing candidate build run ID' }
          $buildId = $Matches[1]
          $build = gh run view $buildId --json name,headSha,headBranch,jobs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $build.name -ne 'AWQM Windows full qualification' -or $build.headBranch -ne 'develop/awqm-foundation') { throw 'Different candidate workflow' }
          $passed = @($build.jobs | Where-Object { $_.name -in @('windows','browser-ui','dependency-audit') -and $_.conclusion -eq 'success' })
          if ($passed.Count -ne 3 -or $build.headSha -cnotmatch '^[0-9a-f]{40}$') { throw 'Candidate qualifications incomplete' }
          $sourceSha = $build.headSha
          git merge-base --is-ancestor $sourceSha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate is not an ancestor' }
          $changed = @(git diff --name-only $sourceSha HEAD)
          if ($LASTEXITCODE -ne 0 -or @($changed | Where-Object { $_ -notin @('tools/hosted_scm_validation.py','.github/workflows/windows-build.yml') }).Count -gt 0) { throw 'Packaged inputs changed; request a full build' }
          $workflow = '.github/workflows/windows-build.yml'
          $previous = (git show "${sourceSha}:$workflow") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Missing original build definition' }
          $current = (Get-Content $workflow) -join "`n"
          $boundary = "`n  service-lifecycle:"
          if (-not $previous.Contains($boundary) -or $previous.Split($boundary)[0] -cne $current.Split($boundary)[0]) { throw 'Windows build definition changed' }
          "run=$buildId" >> $env:GITHUB_OUTPUT
          "source=$sourceSha" >> $env:GITHUB_OUTPUT
          Write-Host "Requalifying the Windows artifact from run $buildId, source $sourceSha."
      - uses: actions/checkout@v4
        with:
          ref: a73e153d119ca646584bab1f838df1ce2894a16d
          path: baseline-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/download-artifact@v4
        with:
          name: AWQM-Windows-dev-x64
          run-id: ${{ steps.candidate.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
          path: candidate-package
      - name: Build the prior 0.41.0 service from its pinned source
        working-directory: baseline-source
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --hidden-import win32timezone --onedir --name AWQM --add-data "awqm/static;awqm/static" launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/AWQM/AWQM.exe dist/AWQM/AWQM_Service.exe
          Copy-Item dist/AWQM/AWQM.exe dist/AWQM/AWQM_Manager.exe
          Copy-Item VERSION.txt,README.md -Destination dist/AWQM
          Copy-Item docs -Destination dist/AWQM/docs -Recurse
          python -m pip freeze | Set-Content -Encoding utf8 dist/AWQM/BUILD-DEPENDENCIES.txt
      - name: Install offline fixture and console test dependencies
        run: python -m pip install -r requirements.txt pywinpty==3.1.2
      - name: Qualify real SCM registration, restart, upgrade and rollback
        env:
          AWQM_BUILD_SHA: ${{ steps.candidate.outputs.source || github.sha }}
          AWQM_BUILD_RUN: ${{ steps.candidate.outputs.run || github.run_id }}
        shell: pwsh
        run: |
          $sums = (Get-Content candidate-package/SHA256SUMS.txt -Raw).Trim() -split '\s+'
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($sums.Length -ne 2 -or $sums[1] -ne "AWQM_${version}_Win11_x64.zip") { throw 'Unexpected package manifest' }
          python -m tools.hosted_scm_validation --archive (Resolve-Path (Join-Path candidate-package $sums[1])) --sha256 $sums[0] --previous (Resolve-Path baseline-source/dist/AWQM) --output service-lifecycle-result.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWQM-hosted-service-evidence
          path: service-lifecycle-result.json
          if-no-files-found: warn
          retention-days: 3

  dependency-audit:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/download-artifact@v4
        with:
          name: AWQM-Windows-dev-x64
          path: audit-input
      - name: Install separate advisory scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Audit exact build dependency versions
        shell: pwsh
        run: |
          python -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r audit-input/BUILD-DEPENDENCIES.txt --format json --output dependency-audit.json
          $scannerExit = $LASTEXITCODE
          python tools/check_dependency_audit.py audit-input/BUILD-DEPENDENCIES.txt dependency-audit.json $scannerExit dependency-audit-summary.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWQM-dependency-audit
          path: |
            audit-input/BUILD-DEPENDENCIES.txt
            dependency-audit.json
            dependency-audit-summary.json
          if-no-files-found: warn
          retention-days: 3

  browser-ui:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[awqm-full]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install isolated browser validation dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium for CI only
        run: python -m playwright install chromium
      - name: Actual synthetic diagnostic browser validation
        run: python -m tools.browser_validation --output browser-validation
      - name: Ten concurrent Chromium sessions on the full synthetic inventory
        run: python -m tools.browser_load_validation --output browser-load-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWQM-browser-evidence
          path: |
            browser-validation/browser-result.json
            browser-load-validation/browser-load-result.json
          if-no-files-found: warn
          retention-days: 3
