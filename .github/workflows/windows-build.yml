name: AWQM Windows development build
on:
  push:
    branches:
      - 'develop/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: awqm-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Source demo smoke test
        run: python launcher.py --demo --smoke-test
      - name: Full synthetic capacity cycle (no SSH)
        run: python launcher.py --validate-scale capacity --output capacity-validation
      - name: Build Windows folder EXE
        run: python -m PyInstaller --noconfirm --clean --onedir --name AWQM --add-data "awqm/static;awqm/static" launcher.py
      - name: Create Windows service and manager entry points
        shell: pwsh
        run: |
          Copy-Item dist\AWQM\AWQM.exe dist\AWQM\AWQM_Service.exe
          Copy-Item dist\AWQM\AWQM.exe dist\AWQM\AWQM_Manager.exe
      - name: Frozen service and manager import smoke tests (no SCM or SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM_Service.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\AWQM\AWQM_Manager.exe smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen executable smoke test
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --demo --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen offline parser smoke test
        shell: pwsh
        run: |
          "user 10%, system 10%, idle 80%" | Set-Content -Encoding utf8 cpu-fixture.txt
          & .\dist\AWQM\AWQM.exe --validate-cli cpu cpu-fixture.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen diagnostic option smoke test (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --collect-once --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen fixture engine smoke (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --engine-demo --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen HTTPS preview option smoke test (no SSH)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --auth-preview --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen Windows DPAPI round trip (synthetic only)
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --dpapi-smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package development ZIP
        shell: pwsh
        run: |
          Copy-Item README.md,VERSION.txt -Destination dist\AWQM
          Copy-Item capacity-validation\capacity-result.json -Destination dist\AWQM
          Copy-Item docs -Destination dist\AWQM\docs -Recurse
          python -m pip freeze | Set-Content -Encoding utf8 dist\AWQM\BUILD-DEPENDENCIES.txt
          Compress-Archive -Path dist\AWQM -DestinationPath AWQM_0.24.0-dev_Win11_x64.zip
          $hash = (Get-FileHash AWQM_0.24.0-dev_Win11_x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  AWQM_0.24.0-dev_Win11_x64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Frozen offline package verification and staging
        shell: pwsh
        run: |
          & .\dist\AWQM\AWQM.exe --stage-package AWQM_0.24.0-dev_Win11_x64.zip --sha256 (Get-FileHash AWQM_0.24.0-dev_Win11_x64.zip -Algorithm SHA256).Hash --output staged-verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AWQM-Windows-dev-x64
          path: |
            AWQM_0.24.0-dev_Win11_x64.zip
            SHA256SUMS.txt
            capacity-validation/capacity-result.json
          if-no-files-found: error
          retention-days: 3
