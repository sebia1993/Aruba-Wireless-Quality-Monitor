name: AWQM Windows portable full qualification
on:
  push:
    branches:
      - 'develop/awqm-portable'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: awqm-full-portable-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  windows:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[awqm-full]') || contains(github.event.head_commit.message, '[publish-awqm-portable]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Source demo smoke test
        run: python launcher.py --demo --smoke-test
      - name: Full synthetic capacity cycle (no SSH)
        run: python launcher.py --validate-scale capacity --output capacity-validation
      - name: Full synthetic concurrent HTTPS and WSS (loopback only)
        run: python launcher.py --validate-scale https --output https-validation
      - name: Retained history representative read benchmark (32 Radios)
        run: python launcher.py --validate-scale retained --output retained-validation
      - name: Representative actual SQLite lifecycle validation
        run: python launcher.py --validate-scale lifecycle --output lifecycle-validation
      - name: Build Windows single EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --name AWQM --hidden-import win32timezone --add-data "awqm/static;awqm/static" launcher.py
      - name: Test isolated standalone EXE (no SCM or SSH)
        shell: pwsh
        run: |
          $trial = Join-Path $env:RUNNER_TEMP 'AWQM-standalone-test'
          New-Item -ItemType Directory -Path $trial | Out-Null
          Copy-Item dist\AWQM.exe $trial
          Push-Location $trial
          try {
            $version = (& .\AWQM.exe --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $version -ne (Get-Content "$env:GITHUB_WORKSPACE\VERSION.txt" -Raw).Trim()) { throw 'Version mismatch' }
            $modes = @(
              @{ Args = @('--service','--smoke-test') },
              @{ Args = @('--manager','smoke-test') },
              @{ Args = @('--demo','--smoke-test') },
              @{ Args = @('--engine-demo','--smoke-test') },
              @{ Args = @('--collect-once','--help') },
              @{ Args = @('--auth-preview','--help') },
              @{ Args = @('--validate-ssh') },
              @{ Args = @('--dpapi-smoke-test') }
            )
            foreach ($mode in $modes) {
              $params = $mode.Args
              & .\AWQM.exe @params
              if ($LASTEXITCODE -ne 0) { throw "Standalone smoke failed: $params" }
            }
            "user 10%, system 10%, idle 80%" | Set-Content -Encoding utf8 cpu-fixture.txt
            & .\AWQM.exe --validate-cli cpu cpu-fixture.txt
            if ($LASTEXITCODE -ne 0) { throw 'Offline parser failed' }
            $PSNativeCommandUseErrorActionPreference = $false
            & .\AWQM.exe --manager install
            if ($LASTEXITCODE -eq 0) { throw 'Portable privileged install unexpectedly allowed' }
            & .\AWQM.exe --service
            if ($LASTEXITCODE -eq 0) { throw 'Portable SCM host unexpectedly allowed' }
            foreach ($action in @('switch-program','reverse-program','rollback-data')) {
              & .\AWQM.exe --manager $action
              if ($LASTEXITCODE -eq 0) { throw "Portable manager action unexpectedly allowed: $action" }
            }
            $global:LASTEXITCODE = 0
          } finally { Pop-Location }
      - name: Verify build contains exactly one executable
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Force)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'AWQM.exe' -or $files[0].PSIsContainer) { throw 'Unexpected build output' }
          Get-FileHash dist\AWQM.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: AWQM-Windows-dev-x64
          path: dist/AWQM.exe
          if-no-files-found: error
          retention-days: 3
      - name: Record exact build dependency versions
        shell: pwsh
        run: python -m pip freeze | Set-Content -Encoding utf8 BUILD-DEPENDENCIES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AWQM-portable-evidence
          path: |
            BUILD-DEPENDENCIES.txt
            capacity-validation/capacity-result.json
            https-validation/https-result.json
            retained-validation/retained-result.json
            lifecycle-validation/lifecycle-result.json
          if-no-files-found: error
          retention-days: 3

  dependency-audit:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/download-artifact@v4
        with:
          name: AWQM-portable-evidence
          path: audit-input
      - name: Install separate advisory scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Audit exact portable build dependency versions
        shell: pwsh
        run: |
          python -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r audit-input/BUILD-DEPENDENCIES.txt --format json --output dependency-audit.json
          $scannerExit = $LASTEXITCODE
          python tools/check_dependency_audit.py audit-input/BUILD-DEPENDENCIES.txt dependency-audit.json $scannerExit dependency-audit-summary.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWQM-portable-dependency-audit
          path: |
            audit-input/BUILD-DEPENDENCIES.txt
            dependency-audit.json
            dependency-audit-summary.json
          if-no-files-found: warn
          retention-days: 3

  publish_portable_preview:
    # Explicit one-time publication request; never promote arbitrary development pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop/awqm-portable' && contains(github.event.head_commit.message, '[publish-awqm-portable]')
    needs: [windows, dependency-audit, browser-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: AWQM-Windows-dev-x64
          path: payload
      - name: Package and verify flat Windows ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]
          export ZIP_NAME="AWQM_${version}_Win11_x64.zip"
          python - <<'PY'
          import os, pathlib, zipfile
          exe=pathlib.Path('payload/AWQM.exe')
          assert sorted(p.name for p in exe.parent.iterdir()) == ['AWQM.exe']
          with exe.open('rb') as f:
              assert f.read(2)==b'MZ'
          with zipfile.ZipFile(os.environ['ZIP_NAME'],'w',compression=zipfile.ZIP_DEFLATED) as z:
              z.write(exe,'AWQM.exe')
          with zipfile.ZipFile(os.environ['ZIP_NAME']) as z:
              assert z.namelist()==['AWQM.exe']
              assert z.testzip() is None
              assert z.read('AWQM.exe')==exe.read_bytes()
          PY
          sha256sum "$ZIP_NAME" > SHA256SUMS.txt
      - name: Publish GitHub prerelease with direct ZIP asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION.txt)"
          tag="v${version}"
          zip="AWQM_${version}_Win11_x64.zip"
          # Fail rather than overwrite or repoint an existing release.
          gh release create "$tag" "$zip" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AWQM ${version} - Windows x64 portable preview" \
            --prerelease --latest=false \
            --notes "Development/field-validation preview, not production-approved. Extract the Windows ZIP once: AWQM.exe only. Run without administrator privileges; select an explicit synthetic mode or approved offline/read-only diagnostics. Actual Windows SCM service lifecycle and privileged manager operation are excluded from this portable preview; legacy protected onedir source path retained. Windows CI, synthetic capacity/HTTPS/history/SQLite lifecycle checks, actual synthetic Chromium UI and exact dependency advisory audit must pass before this publication. Source commit: $GITHUB_SHA. Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

  browser-ui:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[awqm-full]') || contains(github.event.head_commit.message, '[publish-awqm-portable]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install isolated browser validation dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium for CI only
        run: python -m playwright install chromium
      - name: Actual synthetic diagnostic browser validation
        run: python -m tools.browser_validation --output browser-validation
      - name: Ten concurrent Chromium sessions on the full synthetic inventory
        run: python -m tools.browser_load_validation --output browser-load-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWQM-portable-browser-evidence
          path: |
            browser-validation/browser-result.json
            browser-load-validation/browser-load-result.json
          if-no-files-found: warn
          retention-days: 3
